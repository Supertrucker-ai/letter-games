<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--ink:#2b2250;--gold:#ffc83d;--pur:#7b5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#5b3fd6}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 60% 40% at 18% 10%,rgba(255,255,255,.5),transparent 70%),radial-gradient(ellipse 50% 30% at 85% 20%,rgba(255,255,255,.4),transparent 70%),linear-gradient(#58c4ff 0%,#b5ecff 66%,#8be25a 66.2%,#4fc23a 100%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:stretch;padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);max-width:720px;margin:0 auto}
.screen.on{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.outline{color:#fff;text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 5px 0 var(--ink)}
.topbar{display:flex;align-items:center;gap:8px;min-height:56px;flex:none}
.topbar .grow{flex:1;min-width:0}
.gear{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #5a3fb8;display:flex;align-items:center;justify-content:center;flex:none}
.gear:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3fb8}
.gear svg{width:32px;height:32px}
.btn{border-radius:22px;font-weight:900;color:#fff;background:#ff7a1a;box-shadow:0 6px 0 #b34d00,0 9px 14px rgba(0,0,0,.18);padding:10px 22px;font-size:26px;min-height:64px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.28);display:inline-flex;align-items:center;justify-content:center;gap:10px;line-height:1.1;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b34d00}
.btn.green{background:#2fbf4a;box-shadow:0 6px 0 #1a7a2c,0 9px 14px rgba(0,0,0,.18)}
.btn.green:active{box-shadow:0 1px 0 #1a7a2c}
.btn.blue{background:#2f8cff;box-shadow:0 6px 0 #1a5cb3,0 9px 14px rgba(0,0,0,.18)}
.btn.blue:active{box-shadow:0 1px 0 #1a5cb3}
.btn.pink{background:#ff4fa3;box-shadow:0 6px 0 #b0236c,0 9px 14px rgba(0,0,0,.18)}
.btn.pink:active{box-shadow:0 1px 0 #b0236c}
.btn.small{font-size:19px;min-height:52px;padding:8px 16px;border-radius:18px}
.btn[disabled]{filter:grayscale(1);opacity:.55}
.csvg{display:block;width:100%;height:100%;overflow:visible}
.pill{background:rgba(255,255,255,.93);border-radius:999px;padding:6px 14px;font-weight:900;font-size:18px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.pill svg{width:24px;height:24px;flex:none}
.pill.left{background:#fff3c4;border:3px solid var(--ink);font-size:20px}
.pill.left b{display:inline-block;min-width:1.2em;text-align:center;font-size:1.15em;color:#e0407a}
.pill.left.tick b{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.6)}}
.pill.rd{background:var(--ink);color:#fff}
/* ---------- figures ---------- */
.fg{position:relative;aspect-ratio:100/140;flex:none}
.fig-svg .eyes-happy,.fig-svg .m-open,.fig-svg .m-oh{display:none}
.fig-svg.happy .eyes-open{display:none}.fig-svg.happy .eyes-happy{display:inline}
.fig-svg.cheer .m-smile,.fig-svg.oh .m-smile{display:none}
.fig-svg.cheer .m-open{display:inline}.fig-svg.oh .m-oh{display:inline}
.fig-svg .leg,.fig-svg .arm{transform-box:view-box}
.fig-svg.wave .arm1,.fig-svg.cheer .arm1{animation:wave1 .4s ease-in-out infinite alternate}
.fig-svg.wave .arm0,.fig-svg.cheer .arm0{animation:wave0 .4s .1s ease-in-out infinite alternate}
.fig-svg.wave1 .arm1{animation:wave1 .4s ease-in-out infinite alternate}
@keyframes wave1{from{transform:rotate(-125deg)}to{transform:rotate(-80deg)}}
@keyframes wave0{from{transform:rotate(125deg)}to{transform:rotate(80deg)}}
.fig-svg.run .leg0{animation:legA .2s ease-in-out infinite alternate}
.fig-svg.run .leg1{animation:legB .2s ease-in-out infinite alternate}
.fig-svg.run .arm0{animation:armA .2s ease-in-out infinite alternate}
.fig-svg.run .arm1{animation:armB .2s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes legB{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}
@keyframes armA{from{transform:rotate(35deg)}to{transform:rotate(-30deg)}}
@keyframes armB{from{transform:rotate(-35deg)}to{transform:rotate(30deg)}}
.fig-svg.flail .leg0,.fig-svg.flail .arm0{animation:fl0 .18s ease-in-out infinite alternate}
.fig-svg.flail .leg1,.fig-svg.flail .arm1{animation:fl1 .18s ease-in-out infinite alternate}
@keyframes fl0{from{transform:rotate(-40deg)}to{transform:rotate(60deg)}}
@keyframes fl1{from{transform:rotate(40deg)}to{transform:rotate(-60deg)}}
.bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.bounce{animation:bnc .5s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes bnc{from{transform:translateY(0) scale(1.06,.94)}to{transform:translateY(-14%) scale(.96,1.04)}}
.dance{animation:dance .6s ease-in-out infinite alternate}
@keyframes dance{0%{transform:translateY(0) rotate(-8deg) scale(1.05,.95)}50%{transform:translateY(-10%) rotate(0) scale(.97,1.03)}100%{transform:translateY(0) rotate(8deg) scale(1.05,.95)}}
.squashin{animation:squash .45s}
@keyframes squash{0%{transform:scale(1.4,.6)}40%{transform:scale(.85,1.2)}70%{transform:scale(1.1,.92)}100%{transform:none}}
.windup{animation:windup .26s forwards}
@keyframes windup{to{transform:scale(1.25,.7) translateY(8%)}}
.youring{position:absolute;left:-14%;right:-14%;bottom:-4%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,200,61,.95),rgba(255,200,61,0) 70%)}
.youtag{position:absolute;left:50%;top:-30%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:900;font-size:13px;border-radius:999px;padding:1px 8px;border:2px solid var(--ink);white-space:nowrap;z-index:3;animation:tagbob .6s ease-in-out infinite alternate}
@keyframes tagbob{to{transform:translateX(-50%) translateY(-4px)}}
/* ---------- select ---------- */
.logo{font-size:clamp(28px,8.4vw,48px);font-weight:900;line-height:1;letter-spacing:1px;text-align:center;font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif}
.logo span{display:inline-block;animation:wavy 1.6s ease-in-out infinite alternate}
@keyframes wavy{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
.stats{display:flex;gap:8px;justify-content:center;margin:2px 0 6px;flex-wrap:wrap;flex:none}
.sel-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.grid-wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;border-radius:22px;background:rgba(255,255,255,.4);padding:6px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,minmax(76px,1fr));gap:6px;height:100%}
.card{background:#fff;border-radius:16px;padding:3px 2px;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;border:3px solid transparent;touch-action:pan-y;min-height:0;min-width:44px;position:relative;overflow:hidden}
.card .fg{height:100%;width:100%;aspect-ratio:auto}
.card.sel{border-color:#ff7a1a;background:#fff3c4;transform:scale(1.07);z-index:2}
.card.sel .fg{animation:bnc .5s cubic-bezier(.3,0,.5,1) infinite alternate}
.card.rand{background:conic-gradient(#ff5a5a,#ffc83d,#6bd13f,#2fb8ff,#a56bff,#ff5a5a);align-items:center}
.card.rand b{font-size:38px;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink)}
.sel-bar{flex:none;display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:22px;padding:8px 10px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.sel-row{display:flex;align-items:center;gap:10px;min-height:76px}
.sel-bar .av{width:56px;height:78px;flex:none}
.sel-bar .who{flex:1;min-width:0;font-weight:900;font-size:23px;line-height:1.1}
.sel-bar .who small{display:block;font-size:15px;color:#6a5f95;margin-top:3px;line-height:1.15}
.sel-bar .who b{color:var(--pur)}
.sel-bar .btn{width:100%}
/* ---------- intro ---------- */
.center-col{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.show-logo{font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:900;font-size:clamp(34px,11vw,64px);line-height:1;letter-spacing:1px}
.show-logo span{display:inline-block;animation:wavy 1.2s ease-in-out infinite alternate}
.tagline{font-size:clamp(18px,5vw,24px);font-weight:900;background:rgba(255,255,255,.92);border-radius:16px;padding:5px 14px}
.lineup{display:grid;grid-template-columns:repeat(9,1fr);gap:2px 3px;width:100%;max-width:560px;background:rgba(255,255,255,.35);border-radius:18px;padding:8px 6px}
.lineup .fg{width:100%;animation:popin .5s backwards,bob .6s ease-in-out infinite alternate}
@keyframes popin{from{transform:scale(0) translateY(40px)}to{transform:none}}
.lineup .me{filter:drop-shadow(0 0 6px #ffc83d) drop-shadow(0 0 2px #fff)}
/* ---------- card ---------- */
.rcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.rtitle{font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:900;font-size:clamp(26px,8vw,44px);line-height:1.02;text-align:center}
.rhero{flex:1;min-height:90px;width:100%;max-width:520px;background:rgba(255,255,255,.55);border-radius:24px;border:4px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.rhero svg{height:100%;width:100%;max-height:260px}
.hero-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:4px}
.hero-row{display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,14px);flex:1;min-height:0;width:100%}
.hero-row .hh{height:100%;max-height:96px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex:none}
.hero-row .hh svg{width:100%;height:100%;max-height:100%}
.hero-row .hh.tl{aspect-ratio:36/92;height:100%}
.hero-row .hh.run{aspect-ratio:100/140}
.hero-row .hh .fg{height:100%;width:auto}
.hero-row .hh.arr{width:34px;aspect-ratio:1}
.hero-row .hh.tapic{animation:bnc .5s infinite alternate;max-height:60px}
.hero-row .hh.trophyic{max-height:80px}
.hero-row.big .hh{max-height:120px}
.hero-row .hh.rope{aspect-ratio:2/1;width:80px}
.hero-row .hh.foam,.hero-row .hh.chairic{max-height:70px}
.hero-row .hh.tile{max-height:80px}
.rrows{flex:none;width:100%;max-width:520px;display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:5px 12px 5px 8px;box-shadow:0 3px 0 rgba(0,0,0,.14);min-height:56px}
.rrow .ic{width:46px;height:46px;flex:none}
.rrow .ic svg{width:100%;height:100%}
.rrow span{font-weight:900;font-size:clamp(20px,5.6vw,26px);line-height:1.05}
.rbtns{flex:none;display:flex;gap:10px;width:100%;max-width:520px;align-items:center}
.rbtns .btn.go{flex:1}
.helpbtn{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--pur);font-size:38px;font-weight:900;box-shadow:0 5px 0 #5a3fb8;flex:none;display:flex;align-items:center;justify-content:center}
.helpbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #5a3fb8}
/* ---------- round arena shared ---------- */
#arena-host{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.bigbtn{flex:none;border-radius:30px;font-weight:900;font-size:clamp(34px,10vw,52px);color:#fff;min-height:clamp(84px,13vh,120px);width:100%;letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,0,.3);touch-action:none;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif}
.bigbtn svg{width:1.1em;height:1.1em}
.bigbtn.run{background:#2fbf4a;box-shadow:0 9px 0 #1a7a2c,0 12px 16px rgba(0,0,0,.2)}
.bigbtn.run.held,.bigbtn.run:active{transform:translateY(7px);box-shadow:0 2px 0 #1a7a2c}
.bigbtn.run.stop{background:#e8453c;box-shadow:0 9px 0 #a02820,0 12px 16px rgba(0,0,0,.2)}
.bigbtn.run.stop.held{box-shadow:0 2px 0 #a02820}
.bigbtn.pull{background:#ff7a1a;box-shadow:0 9px 0 #b34d00,0 12px 16px rgba(0,0,0,.2)}
.bigbtn.pull:active,.bigbtn.pull.held{transform:translateY(7px);box-shadow:0 2px 0 #b34d00}
.timerbar{flex:none;height:14px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;border:3px solid var(--ink);margin:2px 0 4px}
.timerbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd23d,#ff9f1a);transform-origin:left;border-radius:99px}
.banner{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:900;font-size:clamp(40px,13vw,76px);pointer-events:none;z-index:20;line-height:1}
.banner.pop{animation:bannerpop .5s cubic-bezier(.2,1.6,.5,1)}
@keyframes bannerpop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.banner small{display:block;font-size:.4em;margin-top:6px}
/* RLGL */
.rl{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rl-top{flex:none;height:clamp(64px,10vh,96px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px;position:relative;z-index:5}
.rl-top .ref{height:100%;aspect-ratio:1}
.rl-top .tl{height:112%;aspect-ratio:36/92;margin-bottom:-2px}
.rl-field{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:20px;background:repeating-linear-gradient(0deg,#79d94f 0 36px,#6fcf46 36px 72px);border:4px solid #fff;transition:box-shadow .2s}
.rl-field.red{box-shadow:inset 0 0 0 100px rgba(255,60,60,.18)}
.rl-field.yellow{box-shadow:inset 0 0 0 100px rgba(255,220,40,.16)}
.rl-field.green{box-shadow:inset 0 0 0 100px rgba(60,255,100,.08)}
.rl-finish{position:absolute;left:0;right:0;top:0;height:26px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/26px 26px;border-bottom:3px solid var(--ink);z-index:1;display:flex;align-items:center;justify-content:center}
.rl-finish b{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 10px;font-size:15px;line-height:20px}
.rl-start{position:absolute;left:0;right:0;height:5px;background:rgba(255,255,255,.7);bottom:6px}
.rn{pointer-events:none;position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 100%}
.rn .fg{width:100%}
.rn .mk{position:absolute;left:50%;top:-34%;transform:translateX(-50%);width:44%;aspect-ratio:1;border-radius:50%;background:#ff3b3b;color:#fff;font-weight:900;font-size:1em;display:flex;align-items:center;justify-content:center;border:2px solid #fff;animation:tagbob .3s infinite alternate;z-index:4}
.rn.caught .fg{filter:grayscale(.7);opacity:.75;animation:shk .15s infinite alternate}
.rn.tired .fg{filter:saturate(.6)}
@keyframes shk{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.rn.me{z-index:10}
.rn.me .fg .youtag{top:-24%}
.rn.done .fg{animation:bnc .35s cubic-bezier(.3,0,.5,1) infinite alternate}
.lightchip{position:absolute;right:8px;top:34px;z-index:6;width:30px;height:30px;border-radius:50%}
/* hopscotch */
.hop{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.hop-crowd{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;background:rgba(255,255,255,.4);border-radius:16px;padding:4px;min-height:30px}
.hop-crowd .fg{width:clamp(18px,5.6vw,30px)}
.hop-crowd .fg.out{animation:plop .6s forwards}
@keyframes plop{40%{transform:translateY(40%) scale(1.1,.7)}100%{transform:translateY(120%) scale(.2);opacity:0}}
.hop-prompt{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:20px;padding:6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.15);min-height:64px;font-weight:900}
.hop-prompt .chip{min-width:48px;height:52px;border-radius:14px;color:#fff;font-size:34px;font-family:"Arial Black",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.hop-prompt .chip.q{background:#eee;color:#9a8fc8;border:3px dashed #9a8fc8;text-shadow:none;animation:qp .8s infinite alternate}
@keyframes qp{to{transform:scale(1.12)}}
.hop-prompt .ar{font-size:26px;color:#9a8fc8}
.hop-prompt .txt{font-size:clamp(17px,4.8vw,22px);line-height:1.05;flex:1;text-align:center}
.hop-field{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:22px;border:4px solid #fff;background:radial-gradient(circle at 20% 30%,#ffd1ec 0 14px,transparent 15px),radial-gradient(circle at 70% 60%,#d6f1ff 0 20px,transparent 21px),radial-gradient(circle at 40% 80%,#fff5b0 0 16px,transparent 17px),radial-gradient(circle at 85% 20%,#d9ffd0 0 18px,transparent 19px),linear-gradient(#ffb3dd,#ff8fcf);background-size:90px 90px,120px 120px,100px 100px,110px 110px,100% 100%}
.hop-track{position:absolute;left:0;top:0;right:0;transition:transform .5s cubic-bezier(.4,0,.2,1);will-change:transform}
.tile{position:absolute;border-radius:16%;color:#fff;font-weight:900;font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-shadow:0 3px 0 rgba(0,0,0,.28);box-shadow:0 7px 0 rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.14),inset 0 6px 0 rgba(255,255,255,.3);transform-origin:50% 100%;transition:opacity .3s,filter .3s;border:3px solid rgba(255,255,255,.7)}
.tile:active{transform:translateY(4px)}
.tile.off{filter:saturate(.5) brightness(.9);opacity:.8;pointer-events:none}
.tile.hint{animation:hintp .6s infinite alternate}
@keyframes hintp{to{transform:scale(1.1);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 7px 0 rgba(0,0,0,.25)}}
.tile.flop{animation:flop .7s forwards;pointer-events:none}
@keyframes flop{30%{transform:rotate(-10deg)}100%{transform:rotate(60deg) translateY(160%);opacity:0}}
.tile.good{animation:goodp .4s;pointer-events:none}
@keyframes goodp{40%{transform:scale(1.18,.85)}}
.tile.start{background:#8a74ff}
.fin-plat{position:absolute;border-radius:24px;background:repeating-conic-gradient(#fff 0 25%,#ffd23d 0 50%) 0 0/24px 24px;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:var(--ink)}
.fin-plat b{background:#fff;border-radius:99px;padding:2px 12px;border:3px solid var(--ink)}
.hop-me{pointer-events:none;position:absolute;left:0;top:0;z-index:5;will-change:transform}
.hop-me .fg{width:100%}
.foam{position:absolute;border-radius:50%;background:#fff;opacity:.95;pointer-events:none;z-index:6}
/* tug */
.tug{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.tug-meter{flex:none;height:46px;position:relative;margin:2px 4px 6px;display:flex;align-items:center}
.tug-meter .bar{position:absolute;left:24px;right:24px;height:20px;border-radius:99px;border:3px solid var(--ink);background:linear-gradient(90deg,#2fbf4a 0 50%,#ff6a3d 50% 100%);top:50%;transform:translateY(-50%)}
.tug-meter .goalL,.tug-meter .goalR{position:absolute;top:2px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;border-radius:50%;border:3px solid var(--ink);z-index:2}
.tug-meter .goalL{left:0;background:#2fbf4a}.tug-meter .goalR{right:0;background:#ff6a3d}
.tug-meter .knob{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;border:4px solid var(--ink);z-index:3;transition:left .08s linear;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tug-field{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:22px;border:4px solid #fff;background:linear-gradient(#8fe0ff 0 46%,#ffd78a 46% 100%)}
.tug-pit{position:absolute;left:50%;top:60%;width:34%;height:12%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ffd1ec,#ff9fd2);border:3px dashed #fff}
.tug-rope{position:absolute;height:9px;border-radius:9px;background:repeating-linear-gradient(90deg,#c58a42 0 10px,#a96f2d 10px 20px);box-shadow:0 2px 0 rgba(0,0,0,.25);will-change:transform}
.tug-flag{position:absolute;width:22px;height:34px;margin:-24px 0 0 -11px;will-change:transform;z-index:3}
.tug-mem{pointer-events:none;position:absolute;left:0;top:0;will-change:transform}
.tug-mem .fg{width:100%}
.tug-lbl{position:absolute;top:6px;font-weight:900;font-size:18px;background:#fff;border-radius:99px;padding:2px 12px;border:3px solid var(--ink);z-index:4}
.tug-field.final{background:linear-gradient(#ffe38a,#ffb347 46%,#ffd78a 46%)}
/* chairs */
.mc{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.mc-banner{flex:none;min-height:60px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(24px,7vw,36px);font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif;border-radius:20px;background:#fff;margin:2px 0 6px;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:4px 12px;text-align:center}
.mc-banner.music{background:#b48bff;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);animation:mbn .5s ease-in-out infinite alternate}
.mc-banner.stop{background:#ff5a4d;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);animation:mbn .25s ease-in-out infinite alternate}
@keyframes mbn{to{transform:scale(1.04) rotate(-.6deg)}}
.mc-banner svg{height:40px;width:40px;flex:none}
.mc-field{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:22px;border:4px solid #fff;background:radial-gradient(circle at 50% 50%,#ffe9a8 0 38%,#ffd0ef 39% 62%,#c7a8ff 63%);}
.chair{position:absolute;left:0;top:0;border-radius:18px;z-index:2;will-change:transform;background:none}
.chair svg{display:block;width:100%;height:100%;overflow:visible}
.chair.free.glow svg{animation:chg .35s infinite alternate}
@keyframes chg{to{transform:scale(1.12);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 4px #ffe066)}}
.chair.taken{pointer-events:none}
.mc-ltr{pointer-events:none;position:absolute;left:0;top:0;will-change:transform;z-index:3}
.mc-ltr .fg{width:100%}
.note{position:absolute;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink);pointer-events:none;z-index:6;animation:noteup 1.6s forwards}
@keyframes noteup{from{transform:translateY(0) rotate(-10deg);opacity:1}to{transform:translateY(-70px) rotate(12deg);opacity:0}}
/* parade + bench */
.par-top{flex:none;display:flex;align-items:center;gap:8px;min-height:56px}
.par-title{flex:1;min-width:0;font-weight:900;font-size:clamp(18px,5vw,24px);line-height:1.05;text-align:center;background:rgba(255,255,255,.9);border-radius:16px;padding:5px 10px}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.arena-disc{position:relative;background:radial-gradient(ellipse at 50% 30%,#ffe9a8,#ffc766);border:5px solid #fff;border-radius:50%/36%;padding:14px 10px 8px;box-shadow:0 8px 0 rgba(0,0,0,.18);margin:0 auto 10px;width:100%;max-width:520px}
.crowd{display:grid;grid-template-columns:repeat(9,1fr);gap:0 2px;align-items:end}
.crowd .slot{aspect-ratio:100/150;display:flex;align-items:flex-end}
.crowd .slot .fg{width:100%}
.crowd .slot .fg.me{filter:drop-shadow(0 0 5px #ffc83d)}
.crowd.sm{grid-template-columns:repeat(13,1fr)}
.bench{position:relative;flex:none;margin:6px auto 0;width:100%;max-width:520px;background:linear-gradient(#ff8fd0,#ff5fb2);border-radius:26px;border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.2);padding:22px 8px 8px}
.bench:before{content:"";position:absolute;inset:6px;border-radius:20px;background:radial-gradient(circle,rgba(255,255,255,.35) 0 3px,transparent 4px) 0 0/16px 16px;pointer-events:none}
.bench-sign{position:absolute;left:50%;top:-18px;transform:translateX(-50%);background:var(--gold);border:4px solid var(--ink);border-radius:14px;padding:2px 12px;font-weight:900;font-size:15px;white-space:nowrap;z-index:3}
.bench .row{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:0 2px;min-height:44px}
.bslot{width:clamp(22px,6.4vw,34px);aspect-ratio:100/140;visibility:hidden;position:relative}
.bslot.in{visibility:visible;animation:squash .45s}
.bslot.me{filter:drop-shadow(0 0 4px #ffc83d)}
.bench.big .bslot{width:clamp(36px,10vw,56px)}

.fbub:before{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-5px;border:5px solid transparent;border-top:8px solid #fff;z-index:1}
.spark{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}

.out-scene{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;position:relative}

.modal{position:absolute;inset:0;background:rgba(30,10,80,.5);display:none;align-items:center;justify-content:center;z-index:300;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 10px)}
.modal.on{display:flex;animation:fadein .2s}

.panel .statline{text-align:center;font-weight:900;font-size:17px;color:#555}

.hl{display:flex;flex-direction:column;gap:8px}

</div>

  </div>

    <div class="stats" id="champ-stats"></div>

// per-frame game loop on the scaled game clock; pauses while settings are open
function loop(fn){var t=RUN;return new Promise(function(res,rej){var last=performance.now();function f(now){if(t!==RUN){rej(ABORT);return}var dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){if(fn(dt*GS)){res();return}}raf(f)}raf(f)})}

/* ===== STORAGE: localStorage -> window.name -> memory ===== */
var Store=(function(){
  var KEY='letterGames.v1',PFX='LETTERGAMES:',mode='memory',mem={};
  function readName(){try{if(typeof window.name==='string'&&window.name.indexOf(PFX)===0)return JSON.parse(window.name.slice(PFX.length))}catch(e){}return null}
  function load(){
    try{var ls=window.localStorage;ls.setItem(KEY+'.t','1');ls.removeItem(KEY+'.t');mode='local';var v=ls.getItem(KEY);mem=v?JSON.parse(v):(readName()||{});return}catch(e){}
    try{var n=readName();window.name=window.name;mode='name';mem=n||{};return}catch(e){}
    mode='memory';mem={};
  }
  function save(){
    var s=JSON.stringify(mem);
    if(mode==='local'){try{localStorage.setItem(KEY,s);return}catch(e){mode='name'}}
    if(mode==='name'){try{window.name=PFX+s;return}catch(e){mode='memory'}}
  }
  load();
  return{get:function(k,d){return mem[k]===undefined?d:mem[k]},set:function(k,v){mem[k]=v;save()},inc:function(k){mem[k]=(mem[k]||0)+1;save();return mem[k]},mode:function(){return mode}};
})();

/* ===== SOUND: WebAudio synth only (no voices, no samples), unlocked on first tap ===== */
var Snd={ctx:null,master:null,on:Store.get('sound',true),log:[],
  unlock:function(){
    try{
      if(!this.ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=0.5;this.master.connect(this.ctx.destination)}
      if(this.ctx.state!=='running')this.ctx.resume();
      var b=this.ctx.createBuffer(1,1,22050),s=this.ctx.createBufferSource();s.buffer=b;s.connect(this.ctx.destination);s.start(0);
    }catch(e){}
  },
  tone:function(f,d,type,vol,when,to){
    var c=this.ctx,t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+0.05);
  },
  noise:function(d,vol,when,f1,f2){
    var c=this.ctx,t=c.currentTime+(when||0),len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),a=b.getChannelData(0);
    for(var i=0;i<len;i++)a[i]=Math.random()*2-1;
    var s=c.createBufferSource();s.buffer=b;var fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f1||1000,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    var g=c.createGain();g.gain.setValueAtTime(vol||0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(this.master);s.start(t);s.stop(t+d+0.05);
  },
  // the silly WEEEEE: a swooping, wobbling whistle-voice made of two detuned oscillators
  whoop:function(k){
    var c=this.ctx,t=c.currentTime,b=300*(k||1);
    [['triangle',1,.2],['sine',2.01,.07]].forEach(function(p){
      var o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
      o.type=p[0];o.frequency.setValueAtTime(b*p[1],t);o.frequency.exponentialRampToValueAtTime(b*3.1*p[1],t+.28);o.frequency.exponentialRampToValueAtTime(b*1.4*p[1],t+1.15);
      l.frequency.value=8;lg.gain.value=b*.05;l.connect(lg);lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p[2],t+.05);g.gain.setValueAtTime(p[2],t+.9);g.gain.exponentialRampToValueAtTime(.0001,t+1.25);
      o.connect(g);g.connect(Snd.master);o.start(t);l.start(t);o.stop(t+1.3);l.stop(t+1.3);
    });
  },
  play:function(n,arg){
    this.log.push(n);if(this.log.length>60)this.log.shift();
    if(!this.on||!this.ctx||this.ctx.state!=='running')return;
    var T=this;
    try{switch(n){
      case 'tap':T.tone(660,0.07,'square',0.1);break;
      case 'select':T.tone(523,0.08,'square',0.1);T.tone(784,0.1,'square',0.1,0.07);break;
      case 'boing':T.tone(220,0.35,'sine',0.35,0,880);T.tone(440,0.3,'triangle',0.12,0.05,1320);break;
      case 'whoosh':T.noise(0.7,0.35,0,300,3200);T.tone(600,0.6,'sine',0.1,0,160);break;
      case 'whoop':T.whoop(arg);break;
      case 'cheer':T.noise(1.0,0.14,0,1500,2600);[523,659,784,1047,784,1047].forEach(function(f,i){T.tone(f,0.12,'square',0.08,i*0.09)});break;
      case 'oops':T.tone(392,0.18,'triangle',0.28,0,330);T.tone(311,0.28,'triangle',0.28,0.16,262);break;
      case 'plop':T.tone(420,0.14,'sine',0.3,0,120);T.noise(0.12,0.12,0,800,300);break;
      case 'land':T.tone(180,0.2,'sine',0.35,0,70);T.noise(0.15,0.12,0,500,200);break;
      case 'go':T.tone(660,0.14,'square',0.14);T.tone(990,0.22,'square',0.14,0.12);break;
      case 'warn':T.tone(740,0.09,'triangle',0.2);break;
      case 'stopp':T.tone(300,0.22,'sawtooth',0.12,0,200);break;
      case 'tick':T.tone(440,0.1,'triangle',0.25);break;
      case 'hop':T.tone(400+(arg||0)*45,0.12,'square',0.12,0,700+(arg||0)*70);break;
      case 'pull':T.tone(150+(arg||0)*4,0.08,'square',0.1,0,110);break;
      case 'win':[523,659,784,1047].forEach(function(f,i){T.tone(f,0.14,'square',0.12,i*0.08)});break;
      case 'sit':T.tone(300,0.12,'triangle',0.3,0,500);break;
      case 'fanfare':[[523,0],[523,.15],[523,.3],[659,.45],[784,.75],[659,1.0],[784,1.15],[1047,1.35]].forEach(function(p){T.tone(p[0],0.3,'square',0.12,p[1]);T.tone(p[0]/2,0.3,'triangle',0.15,p[1])});T.noise(2,0.1,0.4,2000,3000);break;
    }}catch(e){}
  },
  // simple looping synth tune for musical chairs (lookahead scheduler)
  music:{on:false,timer:null,step:0,next:0,
    N:[0,2,4,7,9,7,4,2, 0,4,7,12,9,7,4,5, 2,5,9,5,7,4,2,0, 4,7,9,7,12,9,7,4],
    start:function(){var S=Snd;if(this.on||!S.ctx||!S.on||S.ctx.state!=='running')return;this.on=true;this.step=0;this.next=S.ctx.currentTime+0.05;var M=this;
      this.timer=setInterval(function(){while(M.next<S.ctx.currentTime+0.2){M.note(M.next,M.step);M.next+=0.15;M.step++}},40)},
    note:function(t,s){var S=Snd,c=S.ctx,k=this.N[s%this.N.length],f=261.63*Math.pow(2,k/12),rel=t-c.currentTime;
      S.tone(f,0.13,'square',0.07,rel);if(s%4===0)S.tone(f/2,0.3,'triangle',0.14,rel);if(s%2===1)S.tone(f*1.5,0.05,'sine',0.04,rel)},
    stop:function(){this.on=false;if(this.timer){clearInterval(this.timer);this.timer=null}}
  }
};

// Fling one letter from rect "from" up through the sky (spinning, shouting WEEEEE) and down onto rect "to" (the cheering bench)
function flingTo(i,from,to,o){
  o=o||{};
  var vw=innerWidth,vh=innerHeight,el=document.createElement('div');el.className='fly';
  var w=Math.max(34,from.w*1.1);el.style.width=w+'px';el.style.height=w*1.4+'px';
  el.innerHTML='<div class="spin">'+figSVG(i,{cls:'flail oh'})+'</div>';fx.appendChild(el);
  var bub=document.createElement('div');bub.className='fbub';bub.textContent=pick(['WEEEEE!','WEEEEE!','WEEEEE!','WHEEEE!','WEEEEEE!']);fx.appendChild(bub);
  var dir=Math.random()<.5?-1:1,x0=from.x+from.w/2-w/2,y0=from.y+from.h-w*1.4,x1=to.x+to.w/2-w/2,y1=to.y+to.h-w*1.4;
  var apex=Math.max(ST.sat+56,Math.min(y0,y1)-vh*0.62),drift=dir*vw*0.18;
  ST.flying++;
  if(!o.mute){Snd.play('whoosh');Snd.play('whoop',0.85+Math.random()*0.5)}
  ST.lastFly={i:i,bubble:bub.textContent};
  return tween(o.ms||1700,function(k){
    var ke=k<.1?0:(k-.1)/.9,x=lerp(x0,x1,ke)+drift*Math.sin(Math.PI*ke),
        y=lerp(y0,y1,ke)-4*(lerp(y0,y1,.5)-apex)*ke*(1-ke)*1.0;
    // simple parabola through apex
    y=(1-ke)*(1-ke)*y0+2*(1-ke)*ke*(2*apex-0.5*(y0+y1))+ke*ke*y1;
    var squash=k<.1?(1+.3*Math.sin(k/.1*Math.PI/1)):1,sc=(1+.4*Math.sin(Math.PI*ke))*(k<.1?1:1);
    el.style.transform='translate('+x+'px,'+y+'px) rotate('+(dir*ke*900)+'deg) scale('+(sc*squash)+','+(sc/(k<.1?squash:1))+')';
    var bx=Math.max(70,Math.min(vw-70,x+w/2)),by=Math.max(ST.sat+14,y-30);
    bub.style.transform='translate('+(bx)+'px,'+(by)+'px) translate(-50%,0) scale('+(ke>0?1+.15*Math.sin(ke*14):1)+')';
    bub.style.opacity=k<.05?k*20:(k>.82?Math.max(0,(1-k)/.18):1);
  }).then(function(){ST.flying--;el.remove();bub.remove()});
}

    var surv=aiNow.filter(function(l){return l!==doomed});
    var meDeadline=T+d.mcSlow;
    var sched=surv.map(function(l){return{l:l,at:T+rr(d.mcFast[0],d.mcFast[1])+rr(0,.6)}}).sort(function(a,b){return a.at-b.at});
    // chairs: k = cur.length-1. If player sits, surv (cur-2) + player = k fill all chairs, doomed gets none.
    // If player fails by meDeadline, the doomed AI takes the last chair, player is out.
    var si=0,doomedSat=false,decided=false;
    while(!decided){
      await sleep(40);
      while(si<sched.length&&T>=sched[si].at){var ch=chairs.filter(function(x){return !x.taken})[0];if(ch){var ai=sched[si].l;sit(lt[ai],ch)}si++}
      if(tapped){ // player is sitting; wait for all survivors
        if(si>=sched.length)decided=true}
      else if(!meIn||cur.indexOf(ST.you)<0){if(si>=sched.length&&T>=meDeadline)decided=true}
      else if(T>=meDeadline){ // player too slow: doomed takes the chair, player is out
        var fc=chairs.filter(function(x){return !x.taken})[0];if(fc){sit(lt[doomed],fc);doomedSat=true}
        decided=true;result='me-out'}
    }
    await sleep(500);
    // who is out this pass
    var out1=null;
    if(result==='me-out')out1=ST.you;else out1=doomed;
    // non-player AI case when player not in the game: doomed is simply out
    if(result==='me-out'){Snd.play('oops');var o1=lt[ST.you];o1.el.firstChild.firstChild.setAttribute('class','csvg fig-svg oh');setBan('Oops! No chair!','stop')}
    else{Snd.play('oops');var o2=lt[out1];o2.el.firstChild.firstChild.setAttribute('class','csvg fig-svg oh');o2.el.classList.add('squashin');setBan(meIn&&cur.indexOf(ST.you)>=0?'You got a chair!':'Someone is out!','music');if(meIn&&cur.indexOf(ST.you)>=0)Snd.play('win')}
    flungAll.push(out1);cur=cur.filter(function(l){return l!==out1});
    await sleep(800);
    if(result==='me-out')break;
    // everyone left stands up, remove the out one
    var oo=lt[out1];if(oo)oo.el.style.visibility='hidden';
  }
  }finally{Snd.music.stop();over=true;chairs.forEach(function(ch){ch.el.classList.remove('glow')});field.removeEventListener('pointerdown',onTap)}
  var out;
  if(result==='me-out'){
    // finish the round off-screen: pick enough other AI to be flung so the count is exact
    var rem=needTotal-flungAll.length,others2=shuffle(cur.filter(function(l){return l!==ST.you})).slice(0,rem);
    out={ok:false,flung:flungAll.concat(others2),from:rectOf(lt[ST.you].el.firstChild)};lt[ST.you].el.style.visibility='hidden';
  }else{out={ok:true,flung:flungAll}}
  setBan(out.ok?(meIn?'You are still in!':'Round done!'):'Soft landing time!','music');
  await sleep(600);
  return out;
}

/* ===== GAME FLOW ===== */
function resetAlive(){ST.alive=[];for(var i=0;i<26;i++)ST.alive.push(i);ST.bench=[];ST.round=0;ST.out=false;ST.watch=false;ST.survived=0;ST.skip=false;ST.champ=null;ST.finalOpp=null}
function startShow(you,random){
  newRun();Snd.music.stop();paused=false;
  ST.you=you;ST.randomPick=!!random;resetAlive();Store.inc('shows');
  ST.phase='intro';setLeft(26);
  $('#lineup').innerHTML=ST.alive.map(function(l,k){return '<div>'+fig(l,'happy',l===you?'me':'')+'</div>'}).join('');
  $$('#lineup .fg').forEach(function(f,k){f.style.animationDelay=(k*0.04)+'s,'+(k*0.05)+'s'});
  show('intro');
  var run=RUN;
  waitClick($('#btn-start')).then(function(){Snd.play('go');return runShow()}).catch(function(e){if(e!==ABORT)throw e});
}
async function runShow(){
  var run=newRun();
  try{
    while(ST.round<ROUNDS.length&&ST.alive.length>1){
      var r=ROUNDS[ST.round],before=ST.alive.slice(),keep=r.keep,res;
      ST.lastRound=ST.round;
      if(ST.out){ // spectating: highlight reel
        var fl=simFlung(before,keep);
        if(r.id==='tug'||r.id==='final'){var t=simTeams(before);var winA=Math.random()<.5;fl=winA?t[1]:t[0];if(r.id==='final')fl=[shuffle(before)[0]]}
        await doParade(r,before,fl,true);
      }else{
        $('#card-rd').textContent=r.name;$('#play-rd').textContent=r.name;setLeft(before.length);
        if(r.id==='final'&&ST.finalOpp===null)ST.finalOpp=pick(before.filter(function(l){return l!==ST.you}));
        var info=cardInfo(r);
        $('#card-title').innerHTML=r.title;
        var hero='';info.hero.replace(/<div class="hero-row[\s\S]*?<\/div><\/div>(?=<div class="hero-row|$)/g,function(m){hero+=m});
        $('#card-hero').innerHTML='<div class="hero-wrap">'+info.hero+'</div>';
        $('#card-rows').innerHTML=info.rows.map(function(x){return '<div class="rrow"><div class="ic">'+x[0]+'</div><span>'+x[1]+'</span></div>'}).join('');
        ST.phase='card';ST.cardId=r.id;show('card');
        var helpFn=function(){openHelp({title:r.short+' - how to play',steps:info.help})};$('#btn-help').onclick=helpFn;
        await waitClick($('#btn-got'));Snd.play('go');
        ST.phase='play';show('play');
        CURF=function(){return null};
        var ctx={alive:before,keep:keep,inGame:true};
        if(r.id==='rlgl')res=await playRLGL(ctx);else if(r.id==='hop')res=await playHop(ctx);else if(r.id==='tug')res=await playTug(ctx,false);else if(r.id==='chairs')res=await playChairs(ctx);else res=await playTug(ctx,true);
        var fl2=res.flung.filter(function(l){return before.indexOf(l)>=0});
        if(!res.ok&&fl2.indexOf(ST.you)<0)fl2.push(ST.you);
        if(res.ok){ST.survived++;Store.inc('rounds')}
        await doParade(r,before,fl2,false,res.ok);
      }
      ST.alive=before.filter(function(l){return ST.lastFl.indexOf(l)<0});
      setLeft(ST.alive.length);
      if(!ST.out&&ST.alive.indexOf(ST.you)<0){ST.out=true;await showOut();return}
      ST.round++;
    }
    await showChamp();
  }catch(e){if(e!==ABORT)throw e}
}
async function doParade(r,before,fl,watch,ok){
  ST.lastFl=fl.slice();ST.skip=false;
  var nxt=before.length-fl.length,mine=fl.indexOf(ST.you)>=0&&!watch;
  var ban=mine?'Oops!':(watch?'':(r.id==='final'?'You won!':'You\'re safe!'));
  var after=nxt===1?'1 letter left!':(fl.length+' flung! Letters left: '+nxt);
  if(watch)ST.phase='watch';
  await parade(before,fl,{title:r.short,watch:watch,banner:mine?'You got flung!':(watch?r.short:'Safe!'),after:mine?'':'<small>'+after+'</small>'});
  ST.alive=before.filter(function(l){return ST.lastFl.indexOf(l)<0});setLeft(ST.alive.length);
  if(watch){
    $('#btn-skip').style.display='none';
    await sleep(ST.skip?0:1300);
  }else if(mine){await sleep(800)}
  else{var nb=$('#btn-next');nb.style.visibility='visible';nb.textContent=nxt===1?'SEE THE WINNER!':'NEXT!';ST.phase='parade-wait';await waitClick(nb);Snd.play('tap')}
}
async function showOut(){
  ST.phase='out';
  $('#out-title').textContent='You got flung! WEEEEE!';
  $('#out-sub').textContent='Soft landing on the cheering bench!';
  var row=$('#out-bench-row');row.innerHTML=benchSlotsHTML();
  ST.bench.forEach(function(l,k){fillBenchSlot(row.children[k],l)});
  show('out');Snd.play('cheer');
  $('#btn-watch').onclick=function(){Snd.play('tap');ST.watch=true;runShow()};
  $('#btn-retry').onclick=function(){Snd.play('go');startShow(ST.you,false)};
  $('#btn-newletter').onclick=function(){Snd.play('tap');toSelect()};
}
var confRAF=null;
function startConfetti(){
  var cv=$('#confetti'),ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr)}
  size();var cols=['#ff5a5a','#ffc83d','#2fbf4a','#2f8cff','#c46bff','#ff8fd6','#fff'],P=[];
  for(var i=0;i<150;i++)P.push({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height*.6,vx:(Math.random()-.5)*2*dpr,vy:(1.5+Math.random()*3)*dpr,s:(6+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)});
  stopConfetti();
  (function lp(){if(cv.width!==Math.round(cv.clientWidth*dpr))size();ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    confRAF=raf(lp)})();
}
function stopConfetti(){if(confRAF&&window.cancelAnimationFrame)cancelAnimationFrame(confRAF);confRAF=null}
async function showChamp(){
  var champ=ST.alive[0],mine=champ===ST.you;ST.champ=champ;ST.phase='champion';
  if(mine)Store.inc('champs');
  $('#champ-stage').innerHTML='<div class="trophy">'+IC.trophy()+'</div>'+fig(champ,'happy cheer','dance')+'<div class="podium">1</div>';
  $('#champ-msg').innerHTML=mine?'You are the champion, '+N(ST.you)+'!':LET[champ]+' ('+N(champ)+') is the champion! Hooray!';
  $('#champ-stats').innerHTML='<span class="pill">'+IC.trophy()+'Shows won: '+Store.get('champs',0)+'</span><span class="pill">'+IC.star()+'Rounds survived: '+ST.survived+'</span>';
  show('champ');Snd.play('fanfare');startConfetti();
  $('#btn-again').onclick=function(){Snd.play('go');stopConfetti();startShow(ST.you,false)};
  $('#btn-newletter2').onclick=function(){Snd.play('tap');stopConfetti();toSelect()};
}
$('#btn-skip').addEventListener('click',function(){ST.skip=true});
/* ---- boot ---- */
buildGrid();toSelect();
window.__LG={
  state:function(){return{phase:ST.phase,screen:ST.screen,you:ST.you,round:ST.round,alive:ST.alive.slice(),aliveN:ST.alive.length,bench:ST.bench.slice(),out:ST.out,watch:ST.watch,survived:ST.survived,diff:ST.diff,champ:ST.champ,flying:ST.flying,cardId:ST.cardId,storage:Store.mode(),sound:Snd.on,lastFly:ST.lastFly||null,lastFl:ST.lastFl||null}},
  cur:function(){return CURF()},
  setSpeed:function(sp,gs){SPEED=sp;if(gs)GS=gs},
  fastDefaults:function(){return{SPEED:SPEED,GS:GS}},
  stats:function(){return{champs:Store.get('champs',0),rounds:Store.get('rounds',0),shows:Store.get('shows',0)}},
  sndLog:function(){return Snd.log.slice()},
  roundDefs:function(){return ROUNDS.map(function(r){return{id:r.id,keep:r.keep,short:r.short}})},
  names:NAMES.slice(),words:WORDS,
  iconHTML:function(){return '<div id="icon" style="width:180px;height:180px;background:linear-gradient(#58c4ff,#b5ecff 62%,#4fc23a 62.4%);position:relative;overflow:hidden"><div style="position:absolute;left:-2px;top:34px;width:62px;height:88px">'+fig(0,'happy')+'</div><div style="position:absolute;left:58px;top:44px;width:64px;height:90px">'+fig(11,'happy')+'</div><div style="position:absolute;left:112px;top:34px;width:62px;height:88px">'+fig(19,'happy')+'</div><div style="position:absolute;left:0;right:0;top:4px;text-align:center;font:900 30px Arial Black,Arial,sans-serif;color:#fff;text-shadow:2px 2px 0 #2b2250,-2px 2px 0 #2b2250,2px -2px 0 #2b2250,-2px -2px 0 #2b2250,0 4px 0 #2b2250">LETTER GAMES</div><div style="position:absolute;left:0;right:0;top:128px;text-align:center;font:900 30px Arial Black,Arial,sans-serif;color:#ffd23d;text-shadow:2px 2px 0 #2b2250,-2px 2px 0 #2b2250,2px -2px 0 #2b2250,-2px -2px 0 #2b2250">WEEEEE!</div></div>'}
};

})();
